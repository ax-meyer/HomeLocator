services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/grundstuecksfinder:latest
    build:
      context: ./Grundstuecksfinder
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Database=homelocator;Username=homelocator;Password=${DB_PASSWORD}"
      Geocoding__NominatimBaseUrl: "http://nominatim:8080/"
      Geocoding__RepairCorruptedStreets: "true"
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grundstuecksfinder.entrypoints=websecure"
      - "traefik.http.routers.grundstuecksfinder.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.grundstuecksfinder.tls=true"
      - "traefik.http.services.grundstuecksfinder.loadbalancer.server.port=8080"
      # Watchtower: only update this container
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - web
      - internal
      - geocoding

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homelocator
      POSTGRES_USER: homelocator
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelocator"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Self-hosted geocoder (Germany only). The first start downloads the Geofabrik extract
  # (~4.5 GB) and imports it, which takes several hours. Afterwards it applies daily OSM
  # diffs on its own.
  nominatim:
    image: mediagis/nominatim:5.3
    restart: unless-stopped
    shm_size: "${NOMINATIM_SHM_SIZE:-1g}"
    # Hard cap so an import that overshoots gets Nominatim killed, not the app or its db.
    mem_limit: "${NOMINATIM_MEM_LIMIT:-9g}"
    environment:
      PBF_URL: https://download.geofabrik.de/europe/germany-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/europe/germany-updates/
      UPDATE_MODE: continuous
      # Streets and house numbers only, no POIs — all the app queries, and much smaller.
      IMPORT_STYLE: address
      IMPORT_WIKIPEDIA: "false"
      # Fewer parallel import/index workers = fewer concurrent maintenance_work_mem users.
      THREADS: "${NOMINATIM_THREADS:-4}"
      # Nominatim's own internal Postgres, reachable only from inside this container.
      NOMINATIM_PASSWORD: "${NOMINATIM_PASSWORD:-nominatim}"
      # The image's defaults assume a 32 GB+ machine. These fit a 16 GB server that has
      # ~10 GB left after the app, its database and the OS. The import additionally sizes
      # osm2pgsql's node cache itself (up to 75% of free host RAM), which is why these are
      # kept small and the container is capped below.
      POSTGRES_SHARED_BUFFERS: "${NOMINATIM_SHARED_BUFFERS:-1GB}"
      POSTGRES_MAINTENANCE_WORK_MEM: "${NOMINATIM_MAINTENANCE_WORK_MEM:-1GB}"
      POSTGRES_AUTOVACUUM_WORK_MEM: "${NOMINATIM_AUTOVACUUM_WORK_MEM:-256MB}"
      # Planner hint only; allocates nothing.
      POSTGRES_EFFECTIVE_CACHE_SIZE: "${NOMINATIM_EFFECTIVE_CACHE_SIZE:-4GB}"
    volumes:
      # No /nominatim/flatnode mount on purpose: mounting it enables flatnode storage, which
      # is sized for the whole planet and only pays off for continent-sized extracts.
      - nominatim_data:/var/lib/postgresql/16/main
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/status || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      # Covers the initial import; health only matters once it finishes.
      start_period: 12h
    # No published ports: only the app reaches it, via the geocoding network. Kept off the
    # internal network so it can't see the app's database.
    networks:
      - geocoding
      # Outbound access to download the extract and daily diffs.
      - egress

networks:
  web:
    external: true
  internal:
    internal: true
  geocoding:
    internal: true
  egress:

volumes:
  postgres_data:
  dataprotection_keys:
  nominatim_data:
